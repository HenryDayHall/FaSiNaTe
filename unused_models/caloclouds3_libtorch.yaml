# CaloClouds3 (CC3) through DDML's LibTorch backend: the model of
# models/caloclouds3.yaml, with the same weights (DDML's models/CC3_SF_2A.pt),
# run by DDML's plugin compiled against LibTorch instead of by DDML's embedded
# Python. So it is caloclouds3's closure test (see closure below).
#
# simulate_models.sh simulates the benchmark scenarios with every model in this
# folder; the file name (caloclouds3_libtorch) names the model and its output
# folders.
#
# The training details are those of models/caloclouds3.yaml: from the
# CaloClouds3 paper, arXiv:2511.01460, and the benchmark paper, "A First Full
# Physics Benchmark for Highly Granular Calorimeter Surrogates".

name: CaloClouds3 (LibTorch)

# Each shower is a set of points (x, y, layer, energy), as many as the shower
# needs, rather than energies on a fixed grid of cells. DDML deposits each
# point in the cell of the real detector it falls in.
representation: point_cloud

# Factors fixed when the model was trained. The model has no input for them, so
# it is only valid where they hold.
fixed_at_training:
  detector:
    name: ILD_l5_o1_v02
    calorimeter: EcalBarrel
    # The training showers were simulated in a regularised copy of this ECal
    # barrel. simulate_models.sh simulates in this detector: the path is
    # relative to k4geo ($k4geo_DIR) unless absolute.
    compact_file: ILD/compact/ILD_l5_o1_v02/ILD_l5_o1_v02.xml
  particle:
    name: gamma  # Geant4's name, which DDML uses
    pdg: 22

# Factors given to the model as context for each shower.
context:
  energy:
    unit: GeV
    training_range: [1, 127]
  direction:
    # DDML passes the polar and azimuthal angles of the incident direction at
    # the calorimeter face, in the local frame (theta' measured from z', the
    # normal to the layers).
    unit: deg
    training_range:
      # In the global ILD frame, photons from the interaction point into the
      # top stave of the barrel.
      frame: global
      theta: [30, 150]
      phi: [80, 110]

# How simulate_models.sh runs the model with the DDML build from
# scripts/build_ddml.sh (DDML's python-inference branch).
ddml:
  # A DDML model configuration written out (ddml_bench/ddml_configs.py): DDML's
  # preset CC3_BARREL, the CaloClouds3 plugin compiled against LibTorch
  # (CaloCloudsTwoAngleModelPolyhedraBarrelTorchModel), loading the weights that
  # the embedded-Python preset of models/caloclouds3.yaml,
  # CC3_BARREL_PY_INTERFACE, loads, instead of the paper's checkpoint. As with
  # that preset, photons above 10 GeV entering the ECal barrel go to the model,
  # except near the ends of the barrel and the joins between its staves.
  # ModelPath is relative to DDML's scripts/ folder, where ddsim runs.
  model_configs:
    - preset: CC3_BARREL
      plugin_properties:
        ModelPath: ../models/CC3_SF_2A.pt
  # The weights, relative to the DDML clone (building DDML downloads them), and
  # their md5 sum, which simulate_models.sh checks, as it checks that ModelPath
  # is this file.
  weights: models/CC3_SF_2A.pt
  weights_md5: "2ad56d91577686071a20278825d48c7e"

# The closure test of the embedded-Python backend. plot_observables.sh also
# draws this model against caloclouds3 alone (closure/caloclouds3_libtorch/ in
# the plots folder), with the metrics between the two, and closure.csv there
# says, for each scenario, whether the two measured the same, number for
# number. Both backends run the same TorchScript model on the same LibTorch
# library, but the model draws its random numbers from LibTorch's own
# generator, which PyTorch seeds anew in every process rather than from
# ddsim's seed. So even the same events with the same ddsim seeds (di_photon's
# simulation_seeds) give other showers in each run, and only the
# distributions should agree (identical: false). Both should be simulated with
# the same software (key4hep.release, ddml.commit), which fetched measurements
# of caloclouds3 may not have been.
closure:
  of: caloclouds3
  identical: false

# How plot_observables.sh draws this model: caloclouds3's colour, darker, and a
# line style of its own, so that the two can be told apart where they agree.
plot:
  color: "#9c4a00"
  linestyle: "--"
