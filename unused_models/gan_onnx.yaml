# GAN through DDML's ONNX Runtime backend: the network of models/gan_libtorch.yaml,
# exported to ONNX (DDML's models/francisca_gan.onnx; its 17 weight tensors are
# those of francisca_gan_jit.pt, number for number). So it is gan_libtorch's
# closure test, of the ONNX backend (see closure below). DDML has no preset for
# it, so its DDML model configuration is written out below.
#
# simulate_models.sh simulates the benchmark scenarios with every model in this
# folder; the file name (gan_onnx) names the model and its output folders.
#
# DDML doesn't say how it was trained. Its grid and conditioning are those of
# the GAN of "Getting High" (arXiv:2005.05334), trained on photons of 10 to 100
# GeV at normal incidence.

name: GAN (ONNX)

# The energy of each cell of a fixed grid, 30 layers of 30 x 30 cells of 5 x 5
# mm^2, which DDML centres where the photon enters and deposits cell by cell
# in the real detector.
representation: regular_grid

# Factors fixed when the model was trained. The model has no input for them, so
# it is only valid where they hold.
fixed_at_training:
  detector:
    # The ILD Si-W ECal: 30 layers of silicon, 5 x 5 mm^2 cells.
    # simulate_models.sh simulates in this detector, as for the other models:
    # the path is relative to k4geo ($k4geo_DIR) unless absolute.
    name: ILD
    calorimeter: EcalBarrel
    compact_file: ILD/compact/ILD_l5_o1_v02/ILD_l5_o1_v02.xml
  particle:
    name: gamma  # Geant4's name, which DDML uses
    pdg: 22
  # Normal incidence: the model has no input for the angle
  direction: normal

# Factors given to the model as context for each shower.
context:
  energy:
    unit: GeV
    # Not documented in DDML; the GAN of arXiv:2005.05334 was trained on 10 to
    # 100 GeV
    training_range: null

# How simulate_models.sh runs the model with the DDML build from
# scripts/build_ddml.sh (DDML's python-inference branch).
ddml:
  # A DDML model configuration written out (ddml_bench/ddml_configs.py), that of
  # models/gan_libtorch.yaml but for the plugin, compiled against ONNX Runtime,
  # and the weights it loads, ../models/francisca_gan.onnx (relative to DDML's
  # scripts/ folder, where ddsim runs). The latent vector is drawn from
  # Geant4's random numbers in the same way, so the two are given the same
  # latent vectors when ddsim's seeds are the same.
  model_configs:
    - plugin: RegularGridGANPolyhedraBarrelONNXModel/BarrelModelONNX
      geometry: ILD_BARREL
      plugin_properties:
        ModelPath: ../models/francisca_gan.onnx
        OptimizeFlag: 1
        IntraOpNumThreads: 1
      applicable_particles: [gamma]
      triggers: {gamma: 10}
      correct_angles: true
  # The weights, in the DDML repository, and their md5 sum, which
  # simulate_models.sh checks, as it checks that ModelPath is this file.
  weights: models/francisca_gan.onnx
  weights_md5: "dccc690aab5cfbef3b4774c6f9ed18de"

# The closure test of the ONNX backend. plot_observables.sh also draws this
# model against gan_libtorch alone (closure/gan_onnx/ in the plots folder), and
# closure.csv there says, for each scenario, whether the two measured the same,
# number for number. The network and its inputs are the same where the seeds
# are, but ONNX Runtime and LibTorch round their arithmetic differently, so the
# events may differ a little: only the distributions need agree.
closure:
  of: gan_libtorch
  identical: false

# How plot_observables.sh draws this model: gan_libtorch's colour, darker, and
# a line style of its own, so that the two can be told apart where they agree.
plot:
  color: "#005f6b"
  linestyle: [0, [3, 1, 1, 1]]
