# A very light run of the whole pipeline, to check that every stage works on
# the cluster before submitting the full benchmark:
#
#   ./slurm_pipeline.sh --config configs/pipeline_test.yaml --dry-run
#   ./slurm_pipeline.sh --config configs/pipeline_test.yaml
#
# It keeps the scenarios, their observables and every model in models/, but
# with two energies of 10 photons each for single_photon, and one energy of
# 10 photon pairs for di_photon, in its three segments (of 4, 3 and 3 pairs,
# input.segments), each simulated with two seeds. That is 5 inputs, each
# simulated by Geant4 and by each model (di_photon's twice each), each
# simulation reconstructed, then the measurements of each simulator and the
# plots: at least one job of each kind, and each kind of dependency between
# them (74 jobs with the three models of models/, 40 with one).
# Its data goes to a folder of its own, so it never mixes with the full
# samples, and its jobs ask for short time limits, so that they start sooner.
# The software (DDML, ILDConfig, the container) is the one the full run uses.
#
# Like configs/local.yaml, this only changes the settings it names, and it is
# read after configs/local.yaml, whose other settings (e.g. paths.software_dir)
# still hold. The stage scripts read it too, through FASINATE_CONFIG:
#
#   FASINATE_CONFIG=configs/pipeline_test.yaml ./plot_observables.sh

paths:
  # data/pipeline_test in the repository (git ignores data/); it holds a few
  # MB, so any filesystem will do.
  software_dir: /data/dust/user/dayhallh/analysis_test/external
  data_dir: /data/dust/user/dayhallh/analysis_test/data

ddml:
  # fix to a commit for maxwell testing
  commit: 263256cca31b37335cd2aae34b81e899bd2a5851

key4hep:
  # fix to a release for maxwell testing
  release: 2026-04-08

container:
  # On maxwell no need for a container. /cvfms is mounted
  enabled: false

scenarios:
  single_photon:
    input:
      # Both above 10 GeV, so that CaloClouds3 simulates them (its preset
      # leaves photons below 10 GeV to Geant4)
      energies: [20, 80]
      n_events: 10
  di_photon:
    input:
      energies: [20]
      n_events: 10
    simulation_seeds: [1, 2]
  # Its inputs are made elsewhere and can't be made shorter here, so it is
  # left out of this test: with its inputs in this data folder (linked from the
  # full one's), enabling it and running with -n 10 tests it on the first 10
  # events of each.
  tau_pairs:
    enabled: false

published:
  # Its inputs and measurements aren't the published ones (it has fewer
  # events), so there is nothing to fetch
  enabled: false

slurm:
  stages:
    generate:
      time: "00:15:00"
    geant4:
      time: "01:00:00"
    models:
      time: "01:00:00"
    reconstruct:
      time: "01:00:00"
    observables:
      time: "00:30:00"
    plot:
      time: "00:15:00"
