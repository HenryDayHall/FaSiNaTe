# A very light run of the whole pipeline, to check that every stage works on
# the cluster before submitting the full benchmark:
#
#   ./slurm_pipeline.sh --config configs/pipeline_test.yaml --dry-run
#   ./slurm_pipeline.sh --config configs/pipeline_test.yaml
#
# It keeps the single_photon scenario, its observables and every model in
# models/, but with two energies of 10 photons each. That is 2 inputs, each
# simulated by Geant4 and by each model, each simulation reconstructed, then
# the measurements of each simulator and the plots: at least one job of each
# kind, and each kind of dependency between them (13 jobs with CaloClouds3
# alone). Its data goes to a folder of its own, so it never mixes with the full
# samples, and its jobs ask for short time limits, so that they start sooner.
# The software (DDML, ILDConfig, the container) is the one the full run uses.
#
# Like configs/local.yaml, this only changes the settings it names, and it is
# read after configs/local.yaml, whose other settings (e.g. paths.software_dir)
# still hold. The stage scripts read it too, through FASINATE_CONFIG:
#
#   FASINATE_CONFIG=configs/pipeline_test.yaml ./plot_observables.sh

paths:
  # data/pipeline_test in the repository (git ignores data/); it holds a few
  # MB, so any filesystem will do.
  data_dir: data/pipeline_test

scenarios:
  single_photon:
    input:
      # Both above 10 GeV, so that CaloClouds3 simulates them (its preset
      # leaves photons below 10 GeV to Geant4)
      energies: [20, 80]
      n_events: 10

slurm:
  stages:
    generate:
      time: "00:15:00"
    geant4:
      time: "01:00:00"
    models:
      time: "01:00:00"
    reconstruct:
      time: "01:00:00"
    observables:
      time: "00:30:00"
    plot:
      time: "00:15:00"
