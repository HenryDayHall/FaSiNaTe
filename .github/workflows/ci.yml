# The tests (tests/): the layout and the task graph, and the whole pipeline
# end to end, with the local executor and with slurm, on fake ddsim, k4run,
# pyLCIO, sbatch and squeue (tests/fakes), through the same launcher and
# setup.sh as on the cluster. And shellcheck on the scripts.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.python }})
    # setup-python has no 3.9 for Ubuntu 26.04, which ubuntu-latest becomes from
    # October 2026 (3.9 reached its end of life first), so 3.9 stays on 24.04
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 as on EL9 login nodes, where the pipeline is planned
          - python: "3.9"
            os: ubuntu-24.04
          # a recent one as in Key4hep releases, where it runs
          - python: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install what the pipeline's Python uses
        run: python -m pip install pyyaml numpy awkward uproot matplotlib h5py particle pytest
      - name: Run the tests
        run: python -m pytest -q tests

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck -x --shell=bash pipeline.sh slurm_pipeline.sh slurm_simulate_geant4.sh \
            generate_input.sh simulate_geant4.sh simulate_models.sh reconstruct_simulation.sh \
            observables_from_reconstruction.sh plot_observables.sh setup.sh scripts/*.sh
